<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Kouthoofd Martensson</title>
<meta name="description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<meta property="og:title" content="Jacob Kouthoofd Martensson">
<meta property="og:description" content="Industrial designer based in Stockholm.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside class="side">
  <div>
    <h1 class="name"><a href="/" data-name>Jacob Kouthoofd Martensson</a></h1>
    <ul class="pages"><li><a href="/about.html">About</a></li></ul>
    <nav aria-label="Projects"><ol class="index" id="index"></ol></nav>
    <p class="bio" id="bio"></p>
  </div>
  <div class="contact">
    <p class="label">Freelance &amp; inquiries</p>
    <p><a id="email" href="#"></a></p>
    <p><a id="instagram" href="#" target="_blank" rel="noopener">Instagram</a></p>
    <p class="fine">© <span data-name></span> <span id="year"></span></p>
  </div>
</aside>

<main id="top"></main>

<!-- All text and images come from content/site.json.
     Edit them in Pages CMS (app.pagescms.org) — no need to touch this file. -->
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pad = n => String(n).padStart(2,'0');

fetch('/content/site.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    document.title = d.name;
    document.querySelectorAll('[data-name]').forEach(el => el.textContent = d.name);
    document.getElementById('bio').textContent = d.bio || '';
    const em = document.getElementById('email');
    em.textContent = d.email; em.href = 'mailto:' + d.email;
    const ig = document.getElementById('instagram');
    if (d.instagram) ig.href = d.instagram; else ig.parentElement.remove();
    document.getElementById('year').textContent = new Date().getFullYear();

    const projects = d.projects || [];
    document.getElementById('index').innerHTML = projects.map((p,i) =>
      `<li><span class="n">${pad(i+1)}</span><a href="/#${slug(p.title)}">${esc(p.title)}</a></li>`).join('');

    document.getElementById('top').innerHTML = projects.map((p,i) => {
      const meta = [p.category + (p.collaborator ? ', with ' + p.collaborator : ''), p.status].filter(Boolean).map(esc).join(' · ');
      const specs = esc(p.specs || '').replace(/\n/g,'<br>');
      const imgs = (p.images || []).map((src,j) =>
        `<figure${j===0?' class="wide"':''}><img src="${esc(src)}" alt="${esc(p.title)}" loading="${i===0&&j===0?'eager':'lazy'}">${j===0&&p.credit?`<figcaption>© ${esc(p.credit)}</figcaption>`:''}</figure>`).join('');
      return `<article class="project" id="${slug(p.title)}">
        <header class="head">
          <span class="n">${pad(i+1)}</span>
          <h2>${esc(p.title)}</h2>
          <span class="meta">${meta}</span>
          ${(p.description||p.specs)?`<details><summary>Info</summary><div class="info"><p class="specs">${specs}</p><p>${esc(p.description)}</p></div></details>`:''}
        </header>
        <div class="media">${imgs}</div>
      </article>`;
    }).join('');

    // Grey out the project currently on screen in the index
    const links = [...document.querySelectorAll('.index a')];
    const obs = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) links.forEach(a => a.classList.toggle('is-active', a.hash === '#' + e.target.id));
    }), { rootMargin: '0px 0px -80% 0px' });
    document.querySelectorAll('.project').forEach(p => obs.observe(p));
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  });
</script>
</body>
</html>
