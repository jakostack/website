<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Kouthoofd Martensson</title>
<meta name="description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<meta property="og:title" content="Jacob Kouthoofd Martensson">
<meta property="og:description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<link rel="stylesheet" href="/style.css">
<script src="/site.js"></script>
</head>
<body>
<main id="top"></main>

<script>
loadSite('projects', d => {
  document.title = d.name;
  const projects = d.projects || [];
  document.getElementById('top').innerHTML = projects.map((p, i) => {
    const meta = [p.category + (p.collaborator ? ', with ' + p.collaborator : ''), p.status].filter(Boolean).map(esc).join(' · ');
    const specs = esc(p.specs || '').replace(/\n/g, '<br>');
    const imgs = (p.images || []).map((src, j) =>
      `<figure${j === 0 ? ' class="wide"' : ''}><img src="${esc(src)}" alt="${esc(p.title)}" loading="${i === 0 && j === 0 ? 'eager' : 'lazy'}">${j === 0 && p.credit ? `<figcaption>© ${esc(p.credit)}</figcaption>` : ''}</figure>`).join('');
    return `<article class="project" id="${slug(p.title)}">
      <header class="head">
        <span class="n">${pad(i + 1)}</span>
        <h2>${esc(p.title)}</h2>
        <span class="meta">${meta}</span>
        ${(p.description || p.specs) ? `<details><summary>Info</summary><div class="info"><p class="specs">${specs}</p><p>${esc(p.description)}</p></div></details>` : ''}
      </header>
      <div class="media">${imgs}</div>
    </article>`;
  }).join('');

  // Grey out the project on screen in the menu's index
  const links = [...document.querySelectorAll('.index a')];
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle('is-active', a.hash === '#' + e.target.id));
  }), { rootMargin: '0px 0px -80% 0px' });
  document.querySelectorAll('.project').forEach(p => obs.observe(p));
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
});
</script>
</body>
</html>
