<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Kouthoofd Martensson</title>
<meta name="description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<meta property="og:title" content="Jacob Kouthoofd Martensson">
<meta property="og:description" content="Industrial designer based in Stockholm.">
<meta property="og:image" content="images/hug-1.svg">
<style>
  :root {
    --ink: #000;
    --muted: #8a8a8a;
    --paper: #fff;
    --line: #e6e6e6;
    --side: 300px;
    --gap: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 13px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--muted); }
  a:focus-visible, summary:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  img { display: block; width: 100%; height: auto; }

  /* ---------- Left column: index, bio, contact ---------- */
  .side {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--side);
    padding: var(--gap);
    display: flex; flex-direction: column; justify-content: space-between;
    overflow-y: auto;
  }
  .name { font-weight: 400; font-size: 13px; margin-bottom: 28px; }
  .index { list-style: none; margin-bottom: 28px; }
  .index li { display: grid; grid-template-columns: 28px 1fr; }
  .index .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .index a.is-active { color: var(--muted); }
  .bio { max-width: 34ch; margin-bottom: 18px; }
  .contact p + p { margin-top: 0; }
  .contact .label { color: var(--muted); }
  .fine { color: var(--muted); margin-top: 28px; }

  /* ---------- Right column: projects ---------- */
  main { margin-left: var(--side); padding: var(--gap) var(--gap) 120px 0; }
  .project { padding-bottom: 140px; }
  .head {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    gap: 0 12px;
    margin-bottom: 14px;
  }
  .head h2 { font-size: inherit; font-weight: 400; }
  .head .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .head .meta { color: var(--muted); }
  details { grid-column: 2 / -1; }
  summary {
    cursor: pointer; list-style: none; display: inline-block;
    color: var(--muted); margin-top: 2px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " +"; }
  details[open] summary::after { content: " –"; }
  .info { display: grid; grid-template-columns: 180px minmax(0, 52ch); gap: 0 24px; padding: 10px 0 8px; }
  .info .specs { color: var(--muted); }

  .media { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .media figure.wide { grid-column: 1 / -1; }
  figcaption { color: var(--muted); font-size: 11px; margin-top: 6px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 820px) {
    .side { position: static; width: auto; padding: 16px; }
    main { margin-left: 0; padding: 0 16px 80px; }
    .project { padding-bottom: 80px; }
    .info { grid-template-columns: 1fr; gap: 8px; }
    .media { grid-template-columns: 1fr; gap: 12px; }
    .head { grid-template-columns: 28px 1fr; }
    .head .meta { grid-column: 2; }
  }
</style>
</head>
<body>
<aside class="side">
  <div>
    <h1 class="name"><a href="#top" data-name>Jacob Kouthoofd Martensson</a></h1>
    <nav aria-label="Projects"><ol class="index" id="index"></ol></nav>
    <p class="bio" id="bio"></p>
  </div>
  <div class="contact">
    <p class="label">Freelance &amp; inquiries</p>
    <p><a id="email" href="#"></a></p>
    <p><a id="instagram" href="#" target="_blank" rel="noopener">Instagram</a></p>
    <p class="fine">© <span data-name></span> <span id="year"></span></p>
  </div>
</aside>

<main id="top"></main>

<!-- All text and images come from content/site.json.
     Edit them in Pages CMS (app.pagescms.org) — no need to touch this file. -->
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pad = n => String(n).padStart(2,'0');

fetch('/content/site.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    document.title = d.name;
    document.querySelectorAll('[data-name]').forEach(el => el.textContent = d.name);
    document.getElementById('bio').textContent = d.bio || '';
    const em = document.getElementById('email');
    em.textContent = d.email; em.href = 'mailto:' + d.email;
    const ig = document.getElementById('instagram');
    if (d.instagram) ig.href = d.instagram; else ig.parentElement.remove();
    document.getElementById('year').textContent = new Date().getFullYear();

    const projects = d.projects || [];
    document.getElementById('index').innerHTML = projects.map((p,i) =>
      `<li><span class="n">${pad(i+1)}</span><a href="#${slug(p.title)}">${esc(p.title)}</a></li>`).join('');

    document.getElementById('top').innerHTML = projects.map((p,i) => {
      const meta = [p.category + (p.collaborator ? ', with ' + p.collaborator : ''), p.status].filter(Boolean).map(esc).join(' · ');
      const specs = esc(p.specs || '').replace(/\n/g,'<br>');
      const imgs = (p.images || []).map((src,j) =>
        `<figure${j===0?' class="wide"':''}><img src="${esc(src)}" alt="${esc(p.title)}" loading="${i===0&&j===0?'eager':'lazy'}">${j===0&&p.credit?`<figcaption>© ${esc(p.credit)}</figcaption>`:''}</figure>`).join('');
      return `<article class="project" id="${slug(p.title)}">
        <header class="head">
          <span class="n">${pad(i+1)}</span>
          <h2>${esc(p.title)}</h2>
          <span class="meta">${meta}</span>
          ${(p.description||p.specs)?`<details><summary>Info</summary><div class="info"><p class="specs">${specs}</p><p>${esc(p.description)}</p></div></details>`:''}
        </header>
        <div class="media">${imgs}</div>
      </article>`;
    }).join('');

    // Grey out the project currently on screen in the index
    const links = [...document.querySelectorAll('.index a')];
    const obs = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) links.forEach(a => a.classList.toggle('is-active', a.hash === '#' + e.target.id));
    }), { rootMargin: '0px 0px -80% 0px' });
    document.querySelectorAll('.project').forEach(p => obs.observe(p));
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  });
</script>
</body>
</html>
