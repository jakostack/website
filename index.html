<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Kouthoofd Martensson</title>
<meta name="description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<meta property="og:title" content="Jacob Kouthoofd Martensson">
<meta property="og:description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<link rel="stylesheet" href="/style.css?v=8">
<script src="/site.js?v=8"></script>
</head>
<body>
<main id="top"></main>

<script>
loadSite('projects', d => {
  document.title = d.name;
  const projects = d.projects || [];
  document.getElementById('top').innerHTML = projects.map((p, i) => {
    const meta = [p.category + (p.collaborator ? ', with ' + p.collaborator : ''), p.status].filter(Boolean).map(esc).join(' · ');
    const specs = esc(p.specs || '').replace(/\n/g, '<br>');
    const url = `/project.html?p=${slug(p.title)}`;
    const first = (p.images || [])[0];
    const hero = first ? `<a class="hero" href="${url}" aria-label="Open ${esc(p.title)}"><img src="${esc(first)}" alt="${esc(p.title)}" loading="${i === 0 ? 'eager' : 'lazy'}"></a>` : '';
    return `<article class="project" id="${slug(p.title)}">
      <header class="head">
        <span class="n">${pad(i + 1)}</span>
        <div class="title">
          <h2><a href="${url}">${esc(p.title)}</a></h2>
          ${(meta || p.description || p.specs) ? `<button class="info-toggle" aria-expanded="false" aria-controls="info-${slug(p.title)}">Info</button>` : ''}
        </div>
        <div class="details" id="info-${slug(p.title)}">
          ${meta ? `<p>${meta}</p>` : ''}
          ${specs ? `<p>${specs}</p>` : ''}
        </div>
        <div class="text">${p.description ? `<p>${esc(p.description)}</p>` : ''}</div>
      </header>
      ${hero}
    </article>`;
  }).join('');

  // Info toggle: shows the details and text for that project
  document.querySelectorAll('.info-toggle').forEach(btn => btn.addEventListener('click', e => {
    if (e.detail > 0) btn.blur(); // mouse or tap: no focus box; keyboard users still get one
    const open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', open);
    btn.closest('.project').classList.toggle('is-open', open);
  }));

  // Grey out the project on screen in the menu's index
  const links = [...document.querySelectorAll('.index a')];
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle('is-active', a.dataset.slug === e.target.id));
  }), { rootMargin: '0px 0px -80% 0px' });
  document.querySelectorAll('.project').forEach(p => obs.observe(p));
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
});
</script>
</body>
</html>
