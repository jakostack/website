<body>
<button class="shuffle" id="shuffle" type="button" hidden>Shuffle</button>
<main>
  <section class="playground" id="playground" aria-label="Playground"></section>
</main>

<script>
loadSite('playground', d => {
  const items = d.playground || [];
  const el = document.getElementById('playground');
  if (!items.length) { el.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  // Random order on every visit
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  el.innerHTML = items.map(it => `
    <article class="entry">
      <div class="shots">${(it.images || []).map(src =>
        `<img src="${esc(src)}" alt="${esc(it.title)}" loading="lazy">`).join('')}</div>
      ${(it.title || it.year) ? `<div class="caption"><h2 style="font:inherit">${esc(it.title)}</h2><span class="year">${esc(it.year)}</span></div>` : ''}
      ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
    </article>`).join('');

  // Shuffle: puts the entries in a new random order on each click
  const btn = document.getElementById('shuffle');
  btn.hidden = items.length < 2;
  btn.addEventListener('click', e => {
    if (e.detail > 0) btn.blur();
    const entries = [...el.children];
    for (let i = entries.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [entries[i], entries[j]] = [entries[j], entries[i]];
    }
    el.append(...entries);
  });
});
</script>
</body>
</html>
