<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Kouthoofd Mårtensson</title>
<meta name="description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<meta property="og:title" content="Jacob Kouthoofd Mårtensson">
<meta property="og:description" content="Jacob Kouthoofd Martensson is an industrial designer exploring how small, creative solutions can spark meaningful impact.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta property="og:image" content="https://kouthoofdmartensson.com/icon-512.png">
<meta property="og:url" content="https://kouthoofdmartensson.com/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/style.css?v=13">
<script src="/site.js?v=13"></script>
</head>
<body>
<main>
  <article class="project project-page is-open" id="project"></article>
  <nav class="project-nav" id="project-nav" aria-label="More projects"></nav>
</main>

<!-- One page for every project: project.html?p=<project-name>. Content comes from content/site.json. -->
<script>
const key = new URLSearchParams(location.search).get('p') || '';
loadSite('project:' + key, d => {
  const projects = d.projects || [];
  const i = projects.findIndex(p => slug(p.title) === key);
  const el = document.getElementById('project');
  if (i < 0) { el.innerHTML = '<p class="empty">This project could not be found. <a href="/">See all projects</a></p>'; return; }
  const p = projects[i];
  document.title = p.title + ' — ' + d.name;
  const meta = [p.category + (p.collaborator ? ', with ' + p.collaborator : ''), p.status].filter(Boolean).map(esc).join(' · ');
  const specs = esc(p.specs || '').replace(/\n/g, '<br>');
  // Media order: main image, then any videos, then the remaining images
  const images = (p.images || []).map(src => ({ type: 'img', src }));
  const videos = (p.videos || []).filter(v => v && v.file).map(v => ({ type: 'video', ...v }));
  const media = images.length ? [images[0], ...videos, ...images.slice(1)] : videos;
  const imgs = media.map((m, j) => {
    const cls = j === 0 ? ' class="wide"' : '';
    const credit = j === 0 && p.credit ? `<figcaption>© ${esc(p.credit)}</figcaption>` : '';
    if (m.type === 'video') {
      const poster = m.poster ? ` poster="${esc(m.poster)}"` : '';
      // Videos with sound: play controls, starts when tapped. Silent videos: loop on their own.
      const attrs = m.sound
        ? `controls playsinline preload="metadata" controlslist="nodownload"`
        : `autoplay muted loop playsinline preload="auto" disablepictureinpicture`;
      return `<figure${cls}><video src="${esc(m.file)}"${poster} ${attrs}></video>${credit}</figure>`;
    }
    return `<figure${cls}><img src="${esc(m.src)}" alt="${esc(p.title)}" loading="${j < 2 ? 'eager' : 'lazy'}">${credit}</figure>`;
  }).join('');
  el.innerHTML = `
    <header class="head">
      <span class="n">${pad(i + 1)}</span>
      <div class="title"><h1>${esc(p.title)}</h1></div>
      <div class="details">
        ${meta ? `<p>${meta}</p>` : ''}
        ${specs ? `<p>${specs}</p>` : ''}
      </div>
      <div class="text">${p.description ? `<p>${esc(p.description)}</p>` : ''}</div>
    </header>
    <div class="media">${imgs}</div>`;
  // Landscape videos span the full width; portrait ones sit in the two-column grid
  el.querySelectorAll('video').forEach(v => {
    const fit = () => { if (v.videoWidth > v.videoHeight) v.closest('figure').classList.add('wide'); };
    if (v.readyState >= 1) fit(); else v.addEventListener('loadedmetadata', fit, { once: true });
    // Visitors who prefer reduced motion get a paused video with controls instead of a loop
    if (v.loop && matchMedia('(prefers-reduced-motion: reduce)').matches) { v.autoplay = false; v.pause(); v.controls = true; }
    else if (v.loop) { v.muted = true; v.play().catch(() => {}); }
  });
  const prev = projects[(i - 1 + projects.length) % projects.length];
  const next = projects[(i + 1) % projects.length];
  document.getElementById('project-nav').innerHTML = projects.length > 1 ? `
    <a href="/project.html?p=${slug(prev.title)}"><span class="label">Previous</span>${esc(prev.title)}</a>
    <a href="/">All projects</a>
    <a href="/project.html?p=${slug(next.title)}"><span class="label">Next</span>${esc(next.title)}</a>` : '<a href="/">All projects</a>';
});
</script>
</body>
</html>
